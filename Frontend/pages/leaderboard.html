<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard | Kopargaon Biodiversity Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<style>
.lb-podium { display: flex; align-items: flex-end; justify-content: center; gap: 16px; margin: 30px 0 40px; height: 180px; }
.podium-col { display: flex; flex-direction: column; align-items: center; width: 120px; }
.podium-avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--bg-tertiary); border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: var(--text-secondary); margin-bottom: 12px; z-index: 2; }
.podium-box { width: 100%; background: linear-gradient(to top, rgba(34,197,94,0.1), rgba(34,197,94,0.3)); border-top-left-radius: 8px; border-top-right-radius: 8px; border: 1px solid var(--green-primary); border-bottom: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; color: var(--text-white); position: relative; }
.podium-1 { height: 140px; background: linear-gradient(to top, rgba(251,191,36,0.1), rgba(251,191,36,0.3)); border-color: var(--accent-amber); }
.podium-1 .podium-avatar { border-color: var(--accent-amber); box-shadow: 0 0 15px rgba(251,191,36,0.4); color: var(--accent-amber); }
.podium-2 { height: 100px; background: linear-gradient(to top, rgba(203,213,225,0.1), rgba(203,213,225,0.3)); border-color: #cbd5e1; }
.podium-2 .podium-avatar { border-color: #cbd5e1; box-shadow: 0 0 15px rgba(203,213,225,0.4); color: #cbd5e1; }
.podium-3 { height: 70px; background: linear-gradient(to top, rgba(180,83,9,0.1), rgba(180,83,9,0.3)); border-color: #b45309; }
.podium-3 .podium-avatar { border-color: #b45309; box-shadow: 0 0 15px rgba(180,83,9,0.4); color: #b45309; }
.podium-name { position: absolute; bottom: 100%; margin-bottom: 8px; font-size: 13px; text-align: center; color: var(--text-primary); white-space: nowrap; }
.podium-pts { font-size: 11px; color: var(--text-dim); margin-top: 2px; font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <div id="main">
    <header id="header">
      <button class="hamburger-btn" id="hamburger-btn"><i class="fa fa-bars"></i></button>
      <div class="header-left">
        <div class="header-page-title">Leaderboard</div>
        <div class="header-breadcrumb">Community Rankings</div>
      </div>
      <div class="header-search">
        <span class="search-icon"><i class="fa fa-search"></i></span>
        <input type="text" id="global-search" placeholder="Search across portal...">
        <div class="search-results" id="search-results"></div>
      </div>
      <div class="header-right">
        <div style="position:relative">
          <div class="notif-btn" id="notif-btn"><i class="fa fa-bell"></i><span class="notif-badge">3</span></div>
          <div class="notif-dropdown" id="notif-dropdown"><div class="notif-dropdown-header"><h4>Notifications</h4><span class="notif-mark-all">Mark all read</span></div><div class="notif-list"></div></div>
        </div>
        <div style="position:relative">
          <div class="user-btn" id="user-btn"><div class="user-avatar">K</div><div class="user-info"><div class="user-name">Kalyani</div><div class="user-role">Observer</div></div></div>
          <div class="user-dropdown" id="user-dropdown">
            <a class="user-dropdown-item" href="profile.html"><i class="fa fa-user-circle"></i> My Profile</a>
            <div class="user-dropdown-divider"></div>
            <div class="user-dropdown-item danger" id="logout-dropdown-btn"><i class="fa fa-sign-out-alt"></i> Logout</div>
          </div>
        </div>
      </div>
    </header>

    <main id="content">
      <div class="page-header">
        <div>
          <h1 class="page-title"><i class="fa fa-trophy text-amber"></i> Community Leaderboard</h1>
          <p style="color:var(--text-dim);font-size:12px;margin-top:3px">Top contributors to Kopargaon's biodiversity mapping</p>
        </div>
      </div>

      <div class="card" style="padding: 24px; max-width: 800px; margin: 0 auto">
        <div id="lb-podium" class="lb-podium">
          <!-- Podium injected by JS -->
        </div>

        <div class="data-table-wrap" style="background:var(--bg-secondary); border-radius:16px; overflow:hidden; border:1px solid var(--border); box-shadow:0 8px 30px rgba(0,0,0,0.2);">
          <table class="data-table" style="width:100%; border-collapse:collapse;">
            <thead>
              <tr style="background:linear-gradient(90deg, rgba(34,197,94,0.1), transparent); border-bottom:1px solid var(--border);">
                <th style="width:80px; padding:16px; text-transform:uppercase; font-size:10px; letter-spacing:1px; color:var(--text-dim);"><i class="fa fa-hashtag text-green" style="margin-right:4px"></i> Rank</th>
                <th style="padding:16px; text-transform:uppercase; font-size:10px; letter-spacing:1px; color:var(--text-dim); text-align:left"><i class="fa fa-user-circle text-blue" style="margin-right:4px"></i> Contributor</th>
                <th style="padding:16px; text-transform:uppercase; font-size:10px; letter-spacing:1px; color:var(--text-dim); text-align:left"><i class="fa fa-id-badge text-amber" style="margin-right:4px"></i> Role</th>
                <th style="padding:16px; text-transform:uppercase; font-size:10px; letter-spacing:1px; color:var(--text-dim); text-align:center"><i class="fa fa-file-alt" style="margin-right:4px"></i> Reports</th>
                <th style="padding:16px; text-transform:uppercase; font-size:10px; letter-spacing:1px; color:var(--text-dim); text-align:right"><i class="fa fa-star text-green" style="margin-right:4px"></i> Points</th>
                <th style="padding:16px; text-transform:uppercase; font-size:10px; letter-spacing:1px; color:var(--text-dim); text-align:left; width:150px"><i class="fa fa-medal text-amber" style="margin-right:4px"></i> Badges</th>
              </tr>
            </thead>
            <tbody id="lb-tbody">
              <tr><td colspan="6" style="text-align:center; padding:30px;"><i class="fa fa-spinner fa-spin text-green" style="font-size:24px;"></i><div style="margin-top:10px; color:var(--text-dim); font-size:12px;">Loading Rankings...</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer>
      <span>© 2026 Kopargaon Biodiversity Portal</span>
      &nbsp;·&nbsp;<a href="../index.html">Dashboard</a>
    </footer>
  </div>
</div>
<script src="../js/data-loader.js"></script>
<script src="../js/auth.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { if (!Auth.guard()) return; });</script>
<script src="../js/app.js"></script>
<script src="../js/leaderboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await LeaderboardPage.init();
  document.getElementById('logout-dropdown-btn')?.addEventListener('click', () => Auth.logout());
});
</script>
</body>
</html>
