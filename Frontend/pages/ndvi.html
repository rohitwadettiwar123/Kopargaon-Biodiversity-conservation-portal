<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDVI Analytics | Kopargaon Biodiversity Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
.coming-soon { text-align:center; padding: 100px 20px; color: var(--text-dim); }
.coming-soon i { font-size: 64px; margin-bottom: 20px; color: var(--green-primary); }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <header id="header">
      <button class="hamburger-btn" id="hamburger-btn"><i class="fa fa-bars"></i></button>
      <div class="header-left"><div class="header-page-title">NDVI Analytics</div></div>
      <div class="header-right"><div class="user-btn" id="logout-dropdown-btn">Logout</div></div>
    </header>
    <main id="content">
      <div class="page-header">
        <h1 class="page-title"><i class="fa fa-seedling text-green"></i> Vegetation Index (NDVI)</h1>
      </div>
      <div class="card coming-soon">
        <i class="fa fa-satellite"></i>
        <h2>Satellite Integration in Progress</h2>
        <p>The Sentinel-2 NDVI analytics module is currently being configured for Kopargaon's GIS boundaries.</p>
      </div>
    </main>
  </div>
</div>
<script src="../js/data-loader.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
