<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDVI Analytics | Kopargaon Biodiversity Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <header id="header">
      <button class="hamburger-btn" id="hamburger-btn"><i class="fa fa-bars"></i></button>
      <div class="header-left"><div class="header-page-title">NDVI Analytics</div></div>
      <div class="header-right"><div class="user-btn" id="logout-dropdown-btn">Logout</div></div>
    </header>
    <main id="content">
      <div class="page-header">
        <h1 class="page-title"><i class="fa fa-satellite text-blue"></i> Satellite Vegetation Index (NDVI)</h1>
      </div>

      <div class="grid-4" style="margin-bottom:20px;">
        <div class="card stat-card"><div class="stat-value text-green" id="ndvi-avg">0.00</div><div class="stat-label">Average NDVI</div></div>
        <div class="card stat-card"><div class="stat-value text-blue" id="ndvi-max">0.00</div><div class="stat-label">Maximum NDVI</div></div>
        <div class="card stat-card"><div class="stat-value text-amber" id="ndvi-min">0.00</div><div class="stat-label">Minimum NDVI</div></div>
        <div class="card stat-card"><div class="stat-value text-primary" id="ndvi-count">0</div><div class="stat-label">Data Points</div></div>
      </div>

      <div class="grid-2" style="margin-bottom:20px;">
        <div class="card">
          <div class="card-title">Vegetation Health Map</div>
          <div id="ndvi-map" style="height:350px; border-radius:12px; background:var(--bg-tertiary);"></div>
        </div>
        <div class="card">
          <div class="card-title">NDVI Distribution</div>
          <canvas id="ndvi-pie-chart" style="height:350px;"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Recent Data Readings</div>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Date</th><th>Coordinates</th><th>NDVI Value</th><th>Health Category</th></tr></thead>
            <tbody id="ndvi-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/data-loader.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/ndvi.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { if (Auth.guard()) NDVIPage.init(); });</script>
</body>
</html>
