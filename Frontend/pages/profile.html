<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Kopargaon Biodiversity Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
.profile-card { max-width: 600px; margin: 40px auto; text-align: center; padding: 40px; }
.p-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--green-faint); color: var(--green-primary); font-size: 40px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; margin-bottom: 20px; border: 3px solid var(--border); }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <header id="header">
      <button class="hamburger-btn" id="hamburger-btn"><i class="fa fa-bars"></i></button>
      <div class="header-left"><div class="header-page-title">Profile</div></div>
    </header>
    <main id="content">
      <div class="card profile-card">
        <div class="p-avatar" id="p-avatar">?</div>
        <h2 id="p-name">Loading...</h2>
        <p id="p-role" style="color:var(--text-dim);margin-bottom:20px"></p>
        <div class="grid-2" style="gap:20px;text-align:left;background:var(--bg-tertiary);padding:20px;border-radius:12px">
          <div><label class="form-label">Email</label><div id="p-email" style="font-weight:600"></div></div>
          <div><label class="form-label">Member Since</label><div id="p-date" style="font-weight:600"></div></div>
        </div>
        <button class="btn btn-outline" style="margin-top:30px;width:100%" onclick="Auth.logout()">Logout</button>
      </div>
    </main>
  </div>
</div>
<script src="../js/data-loader.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!Auth.guard()) return;
  const user = Auth.getUser();
  if (user) {
    document.getElementById('p-name').textContent = user.full_name;
    document.getElementById('p-avatar').textContent = user.full_name.charAt(0).toUpperCase();
    document.getElementById('p-role').textContent = user.role;
    document.getElementById('p-email').textContent = user.email;
    document.getElementById('p-date').textContent = new Date(user.join_date).toLocaleDateString();
  }
});
</script>
</body>
</html>
